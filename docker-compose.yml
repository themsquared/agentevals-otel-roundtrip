services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    container_name: agentevals-roundtrip-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # Host ports offset by +10000 so this doesn't collide with an OTel
      # Collector you may already have running on the default 4317/4318.
      - "14318:4318" # OTLP/HTTP — stands in for "your existing backend"
      - "14317:4317" # OTLP/gRPC
